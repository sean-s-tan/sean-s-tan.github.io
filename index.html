<style>
  /* Sidebar active indicator */
  .active-indicator {
    position: absolute;
    left: -12px;
    width: 4px;
    height: 20px;
    background: var(--accent);
    border-radius: 4px;
    transform: translateY(0);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), height 0.35s ease;
  }

  /* Add a hover effect: slight scale for links */
  nav a:hover {
    color: var(--accent);
    transform: translateX(6px);
  }
</style>

<script>
const topBtn = document.getElementById('backToTop');
window.addEventListener('scroll', () => { topBtn.style.display = window.scrollY > 300 ? 'block' : 'none'; });
topBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

// Sidebar active indicator & hover "magnet" effect
const sections = document.querySelectorAll('section');
const navLinks = document.querySelectorAll('.sidebar nav a');
const indicator = document.querySelector('.active-indicator');

function updateIndicator(targetLink) {
  if(targetLink) {
    const rect = targetLink.getBoundingClientRect();
    const sidebarRect = document.querySelector('.sidebar').getBoundingClientRect();
    indicator.style.height = rect.height + 'px';
    indicator.style.transform = `translateY(${rect.top - sidebarRect.top}px)`;
  }
}

// Highlight current section
window.addEventListener('scroll', () => {
  let current = '';
  sections.forEach(section => {
    const sectionTop = section.offsetTop - 120;
    const sectionHeight = section.clientHeight;
    if (window.pageYOffset >= sectionTop && window.pageYOffset < sectionTop + sectionHeight) {
      current = section.getAttribute('id');
    }
  });
  navLinks.forEach(link => link.classList.remove('active-link'));
  navLinks.forEach(link => { if(link.getAttribute('href') === `#${current}`) link.classList.add('active-link'); });
  const activeLink = document.querySelector('.sidebar nav a.active-link');
  updateIndicator(activeLink);
});

// Hover effect: indicator follows hovered link
navLinks.forEach(link => {
  link.addEventListener('mouseenter', () => updateIndicator(link));
  link.addEventListener('mouseleave', () => {
    const activeLink = document.querySelector('.sidebar nav a.active-link');
    updateIndicator(activeLink);
  });
});

window.addEventListener('resize', () => {
  const activeLink = document.querySelector('.sidebar nav a.active-link');
  updateIndicator(activeLink);
});
setTimeout(() => {
  const activeLink = document.querySelector('.sidebar nav a.active-link');
  updateIndicator(activeLink);
}, 400);
</script>
